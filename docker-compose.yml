# Production stack (single VPS, reached only through Cloudflare Tunnel).
#   cp .env.example .env  # fill in values
#   docker compose up -d --build
# No ports are published (optional loopback binding is commented out under app).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://planmark:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/planmark
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      # https://pab.example.com : used for invite/reset links and CORS. Strongly recommended (see .env.example).
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Optional first-run setup code; if empty one is generated and logged while there are no users.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Encrypts off-site backup passwords/tokens stored by the admin Backups page: openssl rand -hex 32
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    volumes:
      - files:/data
      # rclone.conf + status shared with the backup service (written by the app, mode 600)
      - rclone:/rclone
    # Uncomment for local debugging only (loopback, never public):
    # ports:
    #   - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: planmark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: planmark
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planmark -d planmark"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Public HTTPS via Cloudflare Tunnel: public hostname -> http://app:3001 (WebSockets work by default)
  cloudflared:
    profiles: ["tunnel"] # enabled by COMPOSE_PROFILES=tunnel in .env; left off for local testing
    image: cloudflare/cloudflared:2025.2.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy

  # Nightly pg_dump (custom format) + tar of the files volume -> ./backups, 14-day retention.
  # backup.sh makes ./backups mode 700 and every backup file mode 600 (they contain password hashes and all plans).
  # Image: Dockerfile.backup = postgres:17 + rclone + jq (built locally, or pulled from GHCR with docker-compose.unraid.yml).
  # Off-site copies (SFTP, S3, OneDrive, Google Drive, Zoho) are configured on the app's admin "Backups" page.
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: planmark
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: planmark
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      RCLONE_DIR: /rclone
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - files:/data:ro
      - ./backups:/backups
      - rclone:/rclone
    depends_on:
      db:
        condition: service_healthy

volumes:
  files:
  pgdata:
  rclone:
