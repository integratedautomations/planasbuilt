# Production stack for the Linux VPS:  docker compose up -d --build
# Put JWT_SECRET, POSTGRES_PASSWORD and CLOUDFLARE_TUNNEL_TOKEN in a .env file next to this one.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://planmark:${POSTGRES_PASSWORD}@db:5432/planmark
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - files:/data
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planmark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: planmark
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Public HTTPS via Cloudflare Tunnel: point the tunnel's public hostname at http://app:3001
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  files:
  pgdata:
