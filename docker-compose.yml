# Production stack (single VPS, reached only through Cloudflare Tunnel).
#   cp .env.example .env  # fill in values
#   docker compose up -d --build
# No ports are published (optional loopback binding is commented out under app).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://planmark:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/planmark
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    volumes:
      - files:/data
    # Uncomment for local debugging only (loopback, never public):
    # ports:
    #   - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: planmark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: planmark
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planmark -d planmark"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Public HTTPS via Cloudflare Tunnel: public hostname -> http://app:3001 (WebSockets work by default)
  cloudflared:
    profiles: ["tunnel"] # enabled by COMPOSE_PROFILES=tunnel in .env; left off for local testing
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy

  # Nightly pg_dump (custom format) + tar of the files volume -> ./backups, 14-day retention.
  backup:
    image: postgres:17
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: planmark
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: planmark
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - files:/data:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  files:
  pgdata:
