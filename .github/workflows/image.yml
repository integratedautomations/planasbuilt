# Builds the app image on every push to master and publishes it to GHCR
# (ghcr.io/integratedautomations/planasbuilt:latest, plus a :sha-<commit> tag for rollbacks).
name: image
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/integratedautomations/planasbuilt:latest
            ghcr.io/integratedautomations/planasbuilt:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
