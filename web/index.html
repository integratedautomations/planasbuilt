<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0F3D6E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap"
    />
    <title>PlanAsBuilt</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app fails to start (e.g. an unsupported browser), show why instead of a blank page.
      (function () {
        function show(msg) {
          setTimeout(function () {
          var r = document.getElementById('root')
          if (!r || r.childElementCount) return
          r.innerHTML = '<div style="font:15px system-ui;padding:24px;color:#0F3D6E"><b>PlanAsBuilt could not start.</b><br>Please update your browser, or send this message to support:<pre style="white-space:pre-wrap;color:#b00"></pre></div>'
          r.querySelector('pre').textContent = msg + '\n' + navigator.userAgent
          }, 500)
        }
        window.addEventListener('error', function (e) { show(String(e.message || e.error)) })
        window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && (e.reason.stack || e.reason))) })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
